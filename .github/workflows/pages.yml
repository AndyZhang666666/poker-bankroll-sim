name: Deploy to GitHub Pages

# 只在 main 分支推送和手动触发时跑。
# 静态导出产物在 out/，由 actions/upload-pages-artifact 上传，
# 再由 deploy-pages 发布 —— 不需要 gh-pages 分支。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署。cancel-in-progress: false 是为了不把正在跑的部署掐断，
# 否则可能留下半个站点。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/configure-pages@v4

      - run: npm ci
      # build 脚本里已经串了 postbuild.mjs，会写入 out/.nojekyll。
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
